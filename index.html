<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#0a0e1a;color:#e2e8f0;min-height:100vh;padding:12px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:720px;margin:0 auto}
  .card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:14px;margin-bottom:10px}

  .dot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:p 1.5s infinite;flex-shrink:0}
  .dot.on{background:#22c55e;animation:none}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
  .peers{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .peer{background:#1f2937;padding:5px 10px;border-radius:4px;font-size:11px}

  #gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:8px}

  .bar{height:5px;background:#0a0e1a;border-radius:3px;overflow:hidden;margin-top:6px;display:none}

  .room-id{font-family:monospace;font-size:11px;color:#64748b;text-align:center;margin-top:6px}

  #installBtn.show{display:block}
  .sync-banner{display:none;background:#f59e0b;color:#0a0e1a;padding:8px 12px;border-radius:6px;font-size:12px;font-weight:bold;margin-bottom:10px;text-align:center}

  #reels{display:none;position:fixed;top:0;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:60;background:#000;overflow-y:scroll;scroll-snap-type:y mandatory}

  .reel .fx{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.4);font-size:90px;opacity:0;pointer-events:none;text-shadow:0 2px 12px #0009}
  .reel .fx.go{animation:fxp .7s ease-out}
  @keyframes fxp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
  .reel .acts .sb{background:#38bdf8;color:#04121c;border-radius:14px;padding:5px 9px;font-size:12px;font-weight:bold;text-shadow:none}
  .reel .acts .sb.on{background:#334155;color:#e2e8f0}
  .cm{display:flex;gap:8px;align-items:flex-start;padding:4px 0;-webkit-user-select:none;user-select:none}
  .cm .cb{flex:1;min-width:0}
  .cm .re{color:#94a3b8;font-size:11px}

<script>
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e; installBtn.classList.add('show');
});
installBtn.onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice;
  deferredPrompt = null; installBtn.classList.remove('show');
};
window.addEventListener('appinstalled', () => installBtn.classList.remove('show'));
</script>

const CHUNK = 256 * 1024;

const IMG_MAX_DIM = 720;
const IMG_QUALITY = 0.55;
const VID_HEIGHT = 360;
const VID_BITRATE = 450_000;
const VID_FPS = 24;

const pending = new Set(JSON.parse(localStorage.getItem('p2p-pending') || '[]'));
const savePending = () => localStorage.setItem('p2p-pending', JSON.stringify([...pending]));
let flushing = false;
async function flushPending(){
  if (flushing || !pending.size || !peers.size) return;
  flushing = true;
  try{
    for (const id of [...pending]){
      if (!peers.size) break;
      if (social.get(id)?.deleted || social.get(id)?.expired){ pending.delete(id); savePending(); continue; }
      const it = items.find(x => x.id === id);
      if (!it) continue;
      syncBanner.classList.add('on'); syncBanner.textContent = '📤 رفع المحفوظ...';
      await sendFileToPeer({blob: it.blob, name: id, mime: it.mime}, myName, undefined, false, id);
      pending.delete(id); savePending();
      log(`📤 أُرسل المحفوظ: ${id}`, 'ok');
    }
  }catch(e){ log('فشل رفع المحفوظ: ' + (e && e.message || e), 'err'); }
  syncBanner.classList.remove('on');
  flushing = false;
}

// ======================================================
// IndexedDB
// ======================================================
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('p2p-group-db', 3);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('media')){
        const store = d.createObjectStore('media', {keyPath: 'id'});
        store.createIndex('ts', 'ts');
      }
      if (!d.objectStoreNames.contains('social')) d.createObjectStore('social', {keyPath: 'id'});
      if (!d.objectStoreNames.contains('dm')) d.createObjectStore('dm', {keyPath: 'id'});
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e);
  });
}
function dbSave(item){
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', 'readwrite');
    tx.objectStore('media').put(item);
    tx.oncomplete = resolve; tx.onerror = reject;
  });
}
function dbGetAll(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', 'readonly');
    const req = tx.objectStore('media').index('ts').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = reject;
  });
}
function dbGetIds(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', 'readonly');
    const req = tx.objectStore('media').getAllKeys();
    req.onsuccess = () => resolve(req.result);
    req.onerror = reject;
  });
}

// ======================================================
// ضغط الصور
// ======================================================
async function compressImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let {width, height} = img;
      if (width > IMG_MAX_DIM || height > IMG_MAX_DIM){
        const ratio = Math.min(IMG_MAX_DIM/width, IMG_MAX_DIM/height);
        width = Math.round(width * ratio);
        height = Math.round(height * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => {
        if (!blob) return reject(new Error('فشل الضغط'));
        resolve({blob, name: file.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg'});
      }, 'image/jpeg', IMG_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('صورة غير صالحة')); };
    img.src = url;
  });
}

// ======================================================
// ضغط الفيديو 360p
// ======================================================
async function compressVideo(file, onProgress){
  return new Promise(async (resolve, reject) => {
    const video = document.createElement('video');
    video.src = URL.createObjectURL(file);
    video.muted = false;
    video.volume = 1;
    video.playsInline = true;

    video.onloadedmetadata = async () => {
      try{
        const duration = video.duration;
        const srcW = video.videoWidth;
        const srcH = video.videoHeight;
        let outH = Math.min(VID_HEIGHT, srcH);
        let outW = Math.round(srcW * (outH / srcH));
        if (outW % 2) outW++;
        if (outH % 2) outH++;

        const canvas = document.createElement('canvas');
        canvas.width = outW; canvas.height = outH;
        const ctx = canvas.getContext('2d');

        let audioStream = null;
        try{
          const audioCtx = new AudioContext();
          const src = audioCtx.createMediaElementSource(video);
          const dest = audioCtx.createMediaStreamDestination();
          src.connect(dest);
          audioCtx.resume().catch(()=>{});
          audioStream = dest.stream;
        }catch(e){}

        const videoStream = canvas.captureStream(VID_FPS);
        const tracks = [...videoStream.getVideoTracks()];
        if (audioStream) tracks.push(...audioStream.getAudioTracks());
        const combined = new MediaStream(tracks);

        const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
          ? 'video/webm;codecs=vp9,opus'
          : MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
            ? 'video/webm;codecs=vp8,opus'
            : 'video/webm';

        const recorder = new MediaRecorder(combined, {mimeType, videoBitsPerSecond: VID_BITRATE, audioBitsPerSecond: 24000});
        const chunks = [];
        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          URL.revokeObjectURL(video.src);
          const blob = new Blob(chunks, {type: 'video/webm'});
          resolve({blob, name: file.name.replace(/\.\w+$/, '') + '.webm', mime: 'video/webm'});
        };

        recorder.start(100);
        try{ await video.play(); }catch(e){ video.muted = true; log('⚠️ المتصفح منع التشغيل بالصوت، سيُرفع بدون صوت', 'err'); await video.play(); }

        const drawFrame = () => {
          if (video.ended || video.paused){ recorder.stop(); return; }
          ctx.drawImage(video, 0, 0, outW, outH);
          if (onProgress) onProgress(video.currentTime / duration);
          requestAnimationFrame(drawFrame);
        };
        video.onended = () => { if (recorder.state !== 'inactive') recorder.stop(); };
        drawFrame();
      }catch(e){ reject(e); }
    };
    video.onerror = () => reject(new Error('فيديو غير صالح'));
    video.load();
  });
}

// ======================================================
// معالجة قبل الإرسال
// ======================================================
async function processFile(file){
  if (file.type.startsWith('image/')){
    compressBanner.classList.add('on');
    compressBanner.textContent = `🗜️ ضغط الصورة: ${file.name}`;
    log(`🗜️ ضغط صورة: ${file.name}`, 'compress');
    try{
      const result = await compressImage(file);
      const saved = ((1 - result.blob.size/file.size) * 100).toFixed(0);
      log(`✅ ${(file.size/1024).toFixed(0)}KB → ${(result.blob.size/1024).toFixed(0)}KB (-${saved}%)`, 'compress');
      compressBanner.classList.remove('on');
      return result;
    }catch(e){
      compressBanner.classList.remove('on');
      log(`⚠️ فشل الضغط — سأرسلها كاملة`, 'err');
      return {blob: file, name: file.name, mime: file.type};
    }
  }

  if (file.type.startsWith('video/')){
    compressBanner.classList.add('on');
    log(`🎥 ضغط فيديو: ${file.name} (قد يأخذ وقتاً)`, 'compress');
    try{
      const result = await compressVideo(file, pct => {
        compressBanner.textContent = `🗜️ ضغط الفيديو: ${(pct*100).toFixed(0)}%`;
      });
      const saved = ((1 - result.blob.size/file.size) * 100).toFixed(0);
      log(`✅ ${(file.size/1048576).toFixed(1)}MB → ${(result.blob.size/1048576).toFixed(1)}MB (-${saved}%)`, 'compress');
      compressBanner.classList.remove('on');
      return result;
    }catch(e){
      compressBanner.classList.remove('on');
      log(`⚠️ فشل ضغط الفيديو — سأرسله كاملاً`, 'err');
      return {blob: file, name: file.name, mime: file.type};
    }
  }

  return null;
}

// ======================================================
// الانضمام
// ======================================================
function joinGroup(){
  if (!joinRoom){ log('📴 لا يوجد اتصال — الوضع المحلي (سيتصل تلقائياً عند عودة الإنترنت)', 'info'); window.addEventListener('online', () => location.reload(), {once: true}); return; }
  log('🔍 الاتصال بشبكة الاكتشاف...', 'info');

  const config = {
    appId: APP_ID,
    relayUrls: [
      'wss://relay.damus.io',
      'wss://nos.lol',
      'wss://relay.primal.net',
      'wss://nostr.mom',
      'wss://relay.snort.social',
      'wss://offchain.pub',
      'wss://nostr-pub.wellorder.net'
    ],
    relayRedundancy: 7
  };
  // إن لم يظهر أحد خلال 20 ثانية أعد محاولة الاكتشاف (حتى مرتين) والتطبيق ساكن
  const rediscover = () => {
    const n = +(sessionStorage.getItem('p2p-rediscover') || 0);
    if (peers.size > 0 || n >= 2) return;
    if (sending || queue.length > 0 || flushing || document.hidden){ setTimeout(rediscover, 10000); return; }
    sessionStorage.setItem('p2p-rediscover', n + 1); location.reload();
  };
  setTimeout(rediscover, 20000);

  const room = joinRoom(config, ROOM_ID);
  log('✅ انضممت لغرفة: ' + ROOM_ID, 'ok');

  const [sendHelloTo, onHello] = room.makeAction('hello');
  window._hello = sendHelloTo;
  window._reqSync = async () => { const ids = items.map(x => x.id); await requestSyncTo({haveIds: ids}); log('📋 طلبت مزامنة السجل', 'sync'); };
  const [requestSyncTo, onSyncReq] = room.makeAction('syncreq');
  const [sendMeta, onMeta] = room.makeAction('meta');
  const [sendChunk, onChunk] = room.makeAction('chunk');
  const [sendEnd, onEnd] = room.makeAction('end');

  room.onPeerJoin(async peerId => {
    log(`👋 عضو دخل: ${peerId.slice(0,8)}`, 'info');
    peers.set(peerId, {name: peerId.slice(0,8), ready: true});
    updateStatus();
    sendHelloTo({name: myName, id: myId}, peerId).catch(()=>{});
    setTimeout(()=>window._sendSoc && window._sendSoc({full: [...social.values()]}, peerId).catch(()=>{}), 1500);

    // مزامنة مع تجنب التكرار
    const cn = navigator.connection;
    setTimeout(flushPending, 400);
    if (ME.autoSync !== false && !(cn && (cn.type === 'cellular' || cn.saveData))){ const myIds = items.map(x => x.id);
      requestSyncTo({haveIds: myIds}, peerId).catch(()=>{});
      log(`📋 أرسلت قائمة ${myIds.length} ملف إلى ${peerId.slice(0,8)}`, 'sync');
      // احتياط: إن لم يصل شيء خلال 25 ثانية اطلب من الجميع
      setTimeout(() => { if (peers.has(peerId) && recv.size === 0) requestSyncTo({haveIds: items.map(x => x.id), fallback: true}, peerId).catch(()=>{}); }, 25000); }
  });

  room.onPeerLeave(peerId => {
    log(`❌ خرج: ${peerId.slice(0,8)}`, 'err');
    peers.delete(peerId);
    updateStatus();
  });

  onHello((data, peerId) => {
    const p = peers.get(peerId);
    if (p){ p.name = data.name; p.uid = data.id; renderPeers(); dmFlush(data.id); dmOnline(); }
  });

  onSyncReq(async (data, peerId) => {
    const haveIds = new Set(data.haveIds || []);
    const saved = items.map(x => ({id: x.id, name: x.id, mime: x.mime, from: x.author, blob: x.blob}));
    // توزيع الحمل: كل ملف يرسله عضو واحد فقط (يُحدَّد بالتجزئة) بدل أن يرسله الجميع
    const cands = [tSelfId, ...[...peers.keys()].filter(k => k !== peerId)].filter(Boolean).sort();
    const mine = id => data.fallback || cands.length <= 1 || cands[hashStr(id) % cands.length] === tSelfId;
    const missing = saved.filter(item => !haveIds.has(item.id) && !pending.has(item.id) && mine(item.id));
    if (missing.length === 0){
      log(`✅ ${peerId.slice(0,8)} لديه كل شيء`, 'sync');
      return;
    }
    log(`📤 إرسال ${missing.length} ناقص إلى ${peerId.slice(0,8)}`, 'sync');
    syncBanner.classList.add('on');
    for (let i = 0; i < missing.length; i++){
      const item = missing[i];
      syncBanner.textContent = `🔄 ${i+1}/${missing.length}...`;
      const blob = item.blob;
      await sendFileToPeer({blob, name: item.name, mime: item.mime}, item.from, peerId, true, item.id);
    }
    syncBanner.classList.remove('on');
    log(`✅ اكتملت المزامنة`, 'ok');
  });

  onMeta((data, peerId) => {
    recv.set(data.id, {
      meta: {...data, from: data.from || peerId.slice(0,8)},
      chunks: [],
      isSync: data.isSync || false
    });
    if (!data.isSync) bar.classList.add('on');
    log(`📥 ${data.name}${data.isSync?' [سجل]':''}`, data.isSync?'sync':'');
  });

  onChunk((data, peerId) => {
    const buf = data.buffer || data;
    const v = new DataView(buf);
    const idLen = v.getUint8(0);
    const id = new TextDecoder().decode(new Uint8Array(buf, 1, idLen));
    const chunk = buf.slice(1 + idLen);
    const r = recv.get(id);
    if (r){
      r.chunks.push(chunk);
      const got = r.chunks.reduce((a,c)=>a+c.byteLength,0);
      if (!r.isSync) barIn.style.width = Math.min(100, got/r.meta.size*100) + '%';
      else syncBanner.textContent = `🔄 ${r.meta.name} (${Math.min(100,got/r.meta.size*100).toFixed(0)}%)`;
    }
  });

  onEnd(async (data, peerId) => {
    const r = recv.get(data.id);
    if (!r) return;
    if (items.some(x => x.id === r.meta.id)){ recv.delete(data.id); bar.classList.remove('on'); barIn.style.width='0%'; return; }
    const blob = new Blob(r.chunks, {type: r.meta.mime});
    const buf = await blob.arrayBuffer();
    if (r.meta.exp && r.meta.exp < Date.now()){ recv.delete(data.id); return; }
    { const o = getSoc(r.meta.id); if (r.meta.exp && !o.exp){ o.exp = r.meta.exp; socSave(o); } }
    await dbSave({id: r.meta.id, name: r.meta.name, mime: r.meta.mime, from: r.meta.from, size: r.meta.size, ts: Date.now(), data: buf});
    if (r.meta.owner){ const o = getSoc(r.meta.id); if (!o.owner){ o.owner = r.meta.owner; } if (r.meta.emeta && !o.meta) o.meta = r.meta.emeta; socSave(o); }
    addMedia(blob, r.meta.mime, r.meta.from, false, false, r.isSync, r.meta.id);
    if (reelsBuilt){ const e = reelsEl.querySelector('.reels-empty'); if (e) e.remove(); const nit = items.find(x => x.id === r.meta.id); if (nit && !reelsEl.querySelector('[data-id="' + nit.id + '"]')) makeReel(nit); }
    recv.delete(data.id);
    if (!r.isSync){
      bar.classList.remove('on'); barIn.style.width='0%';
      log(`✅ ${r.meta.name}`, 'ok');
    } else log(`📚 ${r.meta.name} [سجل]`, 'sync');
  });

  const [sendSoc, onSoc] = room.makeAction('social');
  window._sendSoc = sendSoc;
  const [sendDM, onDM] = room.makeAction('dm');
  window._sendDM = sendDM;
  onDM((d, pid) => dmReceive(d, pid));
  onSoc((d, pid) => {
    if (d.full){ d.full.forEach(o => mergeSoc(o)); return; }
    if (d.type === 'profile'){ mergeProf(d.p); return; }
    if (d.type === 'sub'){ applySub(d.uid, d.by, d.on, d.ts); return; }
    const o = getSoc(d.id);
    if (d.type === 'like'){ o.likes = o.likes.filter(u => u !== d.uid); if (d.on) o.likes.push(d.uid); }
    if (d.type === 'comment') addComment(o, d.c);
    if (d.type === 'cdel'){ const c = o.comments.find(x => x.id === d.cid); if (c && c.uid === d.uid && !c.del){ c.del = true; c.text = ''; delete c.img; } }
    if (d.type === 'cedit'){ const c = o.comments.find(x => x.id === d.cid); if (c && c.uid === d.uid && !c.del && (d.ts || 0) > (c.edited || 0)){ c.text = d.text; c.edited = d.ts; } }
    if (d.type === 'clike'){ const c = o.comments.find(x => x.id === d.cid); if (c){ c.likes = (c.likes || []).filter(u => u !== d.uid); if (d.on) c.likes.push(d.uid); } }
    if (d.type === 'del'){ if (o.owner === d.uid) removeLocal(d.id); return; }
    if (d.type === 'edit'){ if (o.owner === d.uid) { o.meta = d.meta; } else return; }
    socSave(o); refreshReel(d.id);
  });
  window._sendMeta = sendMeta;
  window._sendChunk = sendChunk;
  window._sendEnd = sendEnd;
}

// ======================================================
// إرسال
// ======================================================
async function sendFileToPeer(processed, from, targetPeerId, isSync=false, existingId=null){
  const id = existingId || crypto.randomUUID().slice(0,8);
  const meta = {id, name: processed.name, size: processed.blob.size, mime: processed.mime, from: from || myName, owner: (id && social.get(id)?.owner) || myId, emeta: (id && social.get(id)?.meta) || null, exp: (id && social.get(id)?.exp) || 0, isSync};
  await window._sendMeta(meta, isSync ? targetPeerId : undefined);
  const buf = await processed.blob.arrayBuffer();
  const idB = new TextEncoder().encode(id);
  for (let off=0; off<buf.byteLength; off+=CHUNK){
    const slice = buf.slice(off, off+CHUNK);
    const c = new Uint8Array(1 + idB.length + slice.byteLength);
    c[0] = idB.length; c.set(idB, 1);
    c.set(new Uint8Array(slice), 1 + idB.length);
    await window._sendChunk(c.buffer, isSync ? targetPeerId : undefined);
  }
  await window._sendEnd({id}, isSync ? targetPeerId : undefined);
}

async function sendOne(job){
  const file = job.file || job;
  const peerIds = [...peers.keys()];
  const processed = await processFile(file);
  if (!processed){ log('نوع غير مدعوم', 'err'); return; }
  if (!processed.blob.size){ log('فشل ضغط الفيديو (ملف فارغ)', 'err'); return; }
  const id = crypto.randomUUID().slice(0,8);
  const buf = await processed.blob.arrayBuffer();
  getSoc(id).exp = Date.now() + (job.days || 7) * 864e5; getSoc(id).owner = myId; if (job.meta) getSoc(id).meta = job.meta; socSave(getSoc(id));
  await dbSave({id, name: processed.name, mime: processed.mime, from: myName, size: processed.blob.size, ts: Date.now(), data: buf});
  if (peerIds.length){
    await sendFileToPeer(processed, myName, undefined, false, id);
    log(`📤 ${processed.name} → ${peerIds.length} طرف`, 'ok');
  } else {
    pending.add(id); savePending();
    log('💾 حُفظ عندك — سيُرسل تلقائياً عند دخول أحد', 'info');
  }
  addMedia(processed.blob, processed.mime, myName, true, false, false, id);
  if (reelsBuilt){ const nit = items.find(x => x.id === id); if (nit && !reelsEl.querySelector('[data-id="' + id + '"]')) makeReel(nit); }
}

function drain(){
  if (sending || !queue.length) return;
  sending = true;
  sendOne(queue.shift()).catch(e => log('فشل الرفع: ' + (e && e.message || e), 'err')).finally(()=>{ sending = false; drain(); });

    im.onerror = () => res(null); im.src = u; });
}
$('cpic').onclick = () => $('cfile').click();
$('cfile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (f.type === 'image/gif'){
    if (f.size > 350000){ alert('ملف GIF كبير (الحد 350KB)'); return; }

$('sav').onchange = async e => {

$('srs').onclick = () => { const c = prompt('الصق رمز الحساب'); if (!c) return; try{ const o = JSON.parse(decodeURIComponent(escape(atob(c.trim())))); if (!o.id) throw 0; ME.id = o.id; ME.name = o.name; ME.email = o.email; localStorage.setItem('p2p-me', JSON.stringify(ME)); location.reload(); }catch(e){ alert('رمز غير صالح'); } };

function removeLocal(id, expired=false){
  const o = getSoc(id); if (expired) o.expired = true; else o.deleted = true; o.likes = []; o.comments = []; o.meta = null; socSave(o);
  const i = items.findIndex(x => x.id === id); if (i >= 0) items.splice(i, 1);
  try{ db.transaction('media','readwrite').objectStore('media').delete(id); }catch(e){}
  document.querySelectorAll('[data-id="' + id + '"]').forEach(e => e.remove());
  if (csheet.classList.contains('on') && curComment === id) csheet.classList.remove('on');
}
function deleteItem(id){
  const mine = getSoc(id).owner === myId;
  if (!confirm(mine ? 'حذف هذا الفيديو من حسابك ومن جميع الأعضاء؟' : 'إزالة هذا الفيديو من جهازك؟')) return;
  removeLocal(id);
  if (mine) broadcast({type:'del', id, uid: myId});
}
let curEdit = null;
function openEdit(id){
  const o = getSoc(id); if (o.owner !== myId) return;
  if (curUp) return; curEdit = id; const m = o.meta || {};
  $('eretl').style.display = 'none'; $('eh').textContent = '✏️ تعديل الفيديو'; $('esave').textContent = 'حفظ'; $('ecancel').textContent = 'إلغاء';

  $('edur').textContent = v && v.duration ? 'مدة الفيديو: ' + v.duration.toFixed(1) + ' ث (اترك النهاية فارغة لتشغيله كاملاً)' : '';
  $('esheet').classList.add('on');
}
let pendingUp = [], curUp = null, pvUrl = null;
function closeEdit(){
  $('esheet').classList.remove('on'); $('epv').style.display = 'none'; $('epv').innerHTML = '';
  if (pvUrl){ URL.revokeObjectURL(pvUrl); pvUrl = null; } curUp = null; curEdit = null;
}
function nextUpload(){
  if (curUp || curEdit || !pendingUp.length) return;
  const f = pendingUp.shift(); curUp = f;
  $('eh').textContent = '📤 تجهيز قبل الرفع'; $('esave').textContent = 'رفع'; $('ecancel').textContent = 'إلغاء الرفع';
  $('etitle').value = f.name.replace(/\.\w+$/, '').slice(0, 60); $('estart').value = 0; $('eend').value = ''; $('efilter').value = '';
  const isV = f.type.startsWith('video/'); pvUrl = URL.createObjectURL(f);
  const m = document.createElement(isV ? 'video' : 'img'); m.src = pvUrl;
  if (isV){ m.controls = true; m.muted = true; m.playsInline = true;
    m.onloadedmetadata = () => { $('edur').textContent = 'مدة الفيديو: ' + m.duration.toFixed(1) + ' ث (اترك النهاية فارغة لتشغيله كاملاً)'; };
    m.ontimeupdate = () => { const e = +$('eend').value || 0, st = +$('estart').value || 0; if (e && e > st && m.currentTime >= e) m.currentTime = st; };
  } else $('edur').textContent = '';
  $('epv').appendChild(m); $('epv').style.display = 'flex';
  $('estart').parentElement.parentElement.style.display = isV ? '' : 'none';
  $('eretl').style.display = ''; $('esheet').classList.add('on');
}
$('efilter').onchange = () => { const m = $('epv').firstChild; if (m) m.style.filter = $('efilter').value; };
$('ecancel').onclick = () => { const up = curUp; closeEdit(); if (up) nextUpload(); };
$('esave').onclick = () => {
  if (curUp){
    const st = Math.max(0, +$('estart').value || 0); let en = +$('eend').value || 0; if (en && en <= st) en = 0;
    queue.push({days: +$('eret').value || 7, file: curUp, meta: {title: $('etitle').value.trim(), start: st, end: en, filter: $('efilter').value, ts: Date.now()}});
    closeEdit(); drain(); nextUpload(); return;
  }
  const o = getSoc(curEdit);
  o.meta = {title: $('etitle').value.trim(), start: Math.max(0, +$('estart').value || 0), end: +$('eend').value || 0, filter: $('efilter').value, ts: Date.now()};
  if (o.meta.end && o.meta.end <= o.meta.start) o.meta.end = 0;
  socSave(o); broadcast({type:'edit', id: curEdit, uid: myId, meta: o.meta});
  $('esheet').classList.remove('on'); refreshReel(curEdit);
  $('eh').textContent = '✏️ تعديل الفيديو';
  const v = reelsEl.querySelector('[data-id="' + curEdit + '"] video'); if (v) v.currentTime = o.meta.start;
  curEdit = null; nextUpload();
};
// الحساب
function b64json(t){ return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))))); }
function setName(n){
  myName = n.trim().slice(0,30) || myName; saveMe(); renderPeers(); myProfPublish();
  window._hello && window._hello({name: myName, id: myId}).catch(()=>{});

$('ssync').onclick = () => { window._reqSync && window._reqSync().catch(()=>{}); $('ssheet').classList.remove('on'); };

$('sclose').onclick = () => $('ssheet').classList.remove('on');

// ======================================================
// الرسائل المباشرة (ند للند) + زر الرفع ➕
// ======================================================
const dmEl = $('dm'), dlist = $('dlist'), dmsgs = $('dmsgs'), din = $('din');
const dmMap = new Map();
let curChat = null, toastT = null;
let dmRead = {}; try{ dmRead = JSON.parse(localStorage.getItem('p2p-dm-read') || '{}'); }catch(e){}

function dmDbAll(){ return new Promise(r => { try{ const q = db.transaction('dm').objectStore('dm').getAll(); q.onsuccess = () => r(q.result); q.onerror = () => r([]); }catch(e){ r([]); } }); }
function dmSave(m){ try{ db.transaction('dm', 'readwrite').objectStore('dm').put(m); }catch(e){} }

const peerIdsOf = uid => [...peers].filter(([, p]) => p.uid === uid && p.ready).map(([id]) => id);
const isOnline = uid => peerIdsOf(uid).length > 0;
const convOf = uid => [...dmMap.values()].filter(m => (m.from === uid && m.to === myId) || (m.from === myId && m.to === uid)).sort((a, b) => a.ts - b.ts);
function userName(uid){
  const p = social.get('u:' + uid); if (p && p.name) return p.name;
  for (const q of peers.values()) if (q.uid === uid && q.name) return q.name;
  const m = [...dmMap.values()].find(x => x.from === uid && x.name); return m ? m.name : 'مستخدم-' + uid.slice(0, 4);
}
function avEl(uid, cls){
  const p = social.get('u:' + uid); let e;
  if (p && p.avatar){ e = document.createElement('img'); e.src = p.avatar; } else { e = document.createElement('div'); e.textContent = '👤'; }
  e.className = cls; return e;
}
function dmUsers(){
  const s = new Set(); dmMap.forEach(m => s.add(m.from === myId ? m.to : m.from)); s.delete(myId); return [...s];
}
const unreadOf = uid => [...dmMap.values()].filter(m => m.from === uid && m.to === myId && m.ts > (dmRead[uid] || 0)).length;
function updateBadge(){
  let n = 0; dmMap.forEach(m => { if (m.to === myId && m.ts > (dmRead[m.from] || 0)) n++; });
  $('dmBadge').textContent = n ? (n > 9 ? '9+' : n) : '';
}
function markRead(uid){
  const c = convOf(uid).filter(m => m.from === uid);
  if (c.length){ const t = c[c.length - 1].ts; if (t > (dmRead[uid] || 0)){ dmRead[uid] = t; try{ localStorage.setItem('p2p-dm-read', JSON.stringify(dmRead)); }catch(e){} } }
  updateBadge();
}

// ---------- إرسال / استقبال ----------
function dmDeliver(m){
  const t = peerIdsOf(m.to);
  if (!t.length || !window._sendDM) return;
  window._sendDM({m: {id: m.id, from: m.from, to: m.to, name: m.name, text: m.text, ts: m.ts}}, t).catch(() => {});
}
function dmFlush(uid){
  [...dmMap.values()].filter(m => m.from === myId && m.to === uid && !m.delivered).sort((a, b) => a.ts - b.ts).forEach(dmDeliver);
}
function dmSendText(){
  const t = din.value.trim().slice(0, 1000);
  if (!t || !curChat) return;
  din.value = '';
  const m = {id: crypto.randomUUID().slice(0, 12), from: myId, to: curChat, name: myName, text: t, ts: Date.now(), delivered: false};
  dmMap.set(m.id, m); dmSave(m); dmDeliver(m);
  renderChat(); din.focus();
}
function dmReceive(d, pid){
  if (!d) return;
  if (d.ack){
    const m = dmMap.get(d.ack);
    if (m && m.from === myId && !m.delivered){ m.delivered = true; dmSave(m); dmRefresh(m.to, false); }
    return;
  }
  const r = d.m; if (!r || !r.id || r.to !== myId || !r.from || typeof r.text !== 'string') return;
  const id = String(r.id).slice(0, 16);
  const pp = peers.get(pid); if (pp && !pp.uid) pp.uid = String(r.from).slice(0, 16);
  const ack = () => window._sendDM && window._sendDM({ack: id}, pid).catch(() => {});
  if (dmMap.has(id)){ ack(); return; }
  const m = {id, from: String(r.from).slice(0, 16), to: myId, name: String(r.name || '').slice(0, 30), text: r.text.slice(0, 1000), ts: Number(r.ts) || Date.now(), delivered: true};
  if (!m.text.trim()) return;
  dmMap.set(id, m); dmSave(m); ack();
  const p = getProf(m.from); if (!p.name && m.name){ p.name = m.name; socSave(p); }
  dmRefresh(m.from, true);
}

// ---------- الواجهة ----------
function renderDMList(only){
  dlist.innerHTML = '';
  const rows = (only || dmUsers()).map(uid => { const c = convOf(uid); return {uid, last: c[c.length - 1], on: isOnline(uid), un: unreadOf(uid)}; });
  rows.sort((a, b) => ((b.last && b.last.ts) || 0) - ((a.last && a.last.ts) || 0) || (b.on - a.on) || userName(a.uid).localeCompare(userName(b.uid)));
  if (!rows.length){ const e = document.createElement('div'); e.className = 'dm-empty'; e.textContent = 'لا توجد محادثات بعد — اكتب معرّف حساب صديقك بالأعلى لبدء محادثة'; dlist.appendChild(e); return; }
  rows.forEach(r => {
    const d = document.createElement('div'); d.className = 'drow';
    const w = document.createElement('div'); w.className = 'avw'; w.appendChild(avEl(r.uid, 'av2'));
    if (r.on){ const o = document.createElement('span'); o.className = 'od'; w.appendChild(o); }
    const b = document.createElement('div'); b.className = 'dinfo';
    const n = document.createElement('b'); n.textContent = userName(r.uid);
    const s = document.createElement('small'); s.textContent = r.last ? ((r.last.from === myId ? 'أنت: ' : '') + r.last.text) : (r.on ? '🟢 متصل الآن' : 'غير متصل');
    b.append(n, s); d.append(w, b);
    if (r.un){ const u = document.createElement('span'); u.className = 'ub'; u.textContent = r.un; d.appendChild(u); }
    d.onclick = () => openChat(r.uid);
    dlist.appendChild(d);
  });
}
function renderChatHead(){
  const h = $('dhead'); h.innerHTML = ''; const uid = curChat; if (!uid) return;
  const w = document.createElement('div'); w.className = 'dnm';
  const n = document.createElement('b'); n.textContent = userName(uid);
  const s = document.createElement('small'); s.textContent = isOnline(uid) ? '🟢 متصل' : '⚪ غير متصل — تصله رسائلك عند اتصاله';
  w.append(n, s); h.append(avEl(uid, 'av2 sm'), w); h.onclick = () => openProfile(uid);
}
function renderChat(){
  const uid = curChat; if (!uid) return;
  dmsgs.innerHTML = '';
  const c = convOf(uid);
  if (!c.length){ const e = document.createElement('div'); e.className = 'dm-empty'; e.textContent = 'ابدأ المحادثة 👋'; dmsgs.appendChild(e); }
  c.forEach(m => {
    const mine = m.from === myId, b = document.createElement('div'); b.className = 'bub' + (mine ? ' me' : '');
    const t = document.createElement('div'); t.textContent = m.text;
    const s = document.createElement('small');
    s.textContent = new Date(m.ts).toLocaleTimeString('ar', {hour: '2-digit', minute: '2-digit'}) + (mine ? (m.delivered ? ' ✓✓' : ' ✓') : '');
    b.append(t, s); dmsgs.appendChild(b);
  });
  dmsgs.scrollTop = dmsgs.scrollHeight;
  markRead(uid);
}
function showDMPanel(){ showTab(false); dmEl.classList.add('on'); $('navHome').classList.remove('on'); $('navMsgs').classList.add('on'); }
function closeChat(){ curChat = null; $('dchat').style.display = 'none'; $('dlistv').style.display = 'flex'; renderDMList(); updateBadge(); }
function openChat(uid){
  if (!uid || uid === myId) return;
  showDMPanel(); curChat = uid;
  $('dlistv').style.display = 'none'; $('dchat').style.display = 'flex';
  renderChatHead(); renderChat();
}
function dmOnline(){ if (dmEl.classList.contains('on')){ if (curChat) renderChatHead(); else renderDMList(); } }
function dmRefresh(uid, incoming){
  const open = dmEl.classList.contains('on'), viewing = open && curChat === uid;
  if (viewing){ renderChat(); renderChatHead(); } else if (open && !curChat) renderDMList();
  updateBadge();
  if (incoming && !viewing) showToast(uid);
}
function toastMsg(text, fn){
  const t = $('toast'); t.textContent = text; t.classList.add('on');
  t.onclick = () => { t.classList.remove('on'); if (fn) fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 4000);
}
function showToast(uid){
  const m = convOf(uid).filter(x => x.from === uid).pop();
  toastMsg('💬 ' + userName(uid) + ': ' + (m ? m.text.slice(0, 40) : ''), () => openChat(uid));
}
function dmSearch(){
  const q = $('dq').value.trim(); if (!q) return;
  if (q.toLowerCase() === myId){ toastMsg('هذا معرّفك أنت 🙂'); return; }
  if (/^[0-9a-f]{8}$/i.test(q)){ $('dq').value = ''; openChat(q.toLowerCase()); return; }
  const ql = q.toLowerCase(), hits = [];
  social.forEach((o, k) => { if (String(k).startsWith('u:') && o.name && o.name.toLowerCase().includes(ql) && String(k).slice(2) !== myId) hits.push(String(k).slice(2)); });
  peers.forEach(p => { if (p.uid && p.name && p.uid !== myId && p.name.toLowerCase().includes(ql) && !hits.includes(p.uid)) hits.push(p.uid); });
  if (hits.length === 1){ $('dq').value = ''; openChat(hits[0]); }
  else if (hits.length) renderDMList(hits);
  else toastMsg('لم يُعثر على الحساب — تأكد من المعرّف');
}
$('navMsgs').onclick = () => { showDMPanel(); closeChat(); };
$('dback').onclick = closeChat;
{ const d = $('dmid'); const b = document.createElement('b'); b.textContent = myId; d.append('معرّفك: ', b, ' 📋 اضغط للنسخ وأرسله لمن تريد مراسلته');
  d.onclick = () => (navigator.clipboard ? navigator.clipboard.writeText(myId) : Promise.reject()).then(() => toastMsg('تم نسخ معرّفك ✅')).catch(() => prompt('معرّفك:', myId)); }
$('dgo').onclick = dmSearch;
$('dq').onkeydown = e => { if (e.key === 'Enter') dmSearch(); };
$('dq').oninput = () => { if (!$('dq').value.trim()) renderDMList(); };
$('dsend').onclick = dmSendText;
din.onkeydown = e => { if (e.key === 'Enter') dmSendText(); };
// زر ➕ أسفل وسط الشاشة: رفع صورة/فيديو
$('navAdd').onclick = () => $('fileIn').click();


init();
updateStatus();
